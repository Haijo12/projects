name: Android APK

# Builds an installable Android APK from the web app (Vite build wrapped by
# Capacitor) and uploads the generated ".apk" as a workflow artifact.
#
# Manual trigger:  Actions -> "Android APK" -> "Run workflow" -> Build Android app.
# Automatic trigger: any push to the default branch.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/01a0879e-projects

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The Vite + Capacitor 6 toolchain requires Node >= 18; Node 20 LTS is used.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # This repo is standardized on bun (bun.lock is committed; package-lock is gitignored).
      - name: Set up Bun
        uses: oven-sh/setup-bun@v1

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web application (production build -> dist/)
        run: bun run build

      # Copies dist/ into android/app/src/main/assets/public (Capacitor webDir).
      - name: Sync Capacitor Android project
        run: bunx cap sync android

      # Gradle 8.2.1 + Android Gradle Plugin 8.2.1 require JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build Android APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      # Uploads the real ".apk" only (never the source repository).
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: note-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
